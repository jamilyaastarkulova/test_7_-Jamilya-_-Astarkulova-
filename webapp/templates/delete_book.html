{% extends 'base.html' %}

{% block title %}Book delete{% endblock %}

{% block content %}



    <h1>Удаление записи</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы действительно хотите удалить запись "{{ book.title }}"?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit">Да</button>
            </form>
            <a href="{% url 'book_view' book.pk %}">Нет</a>
        </div>
    </div>
{% endblock %}
