{% extends 'base.html' %}

{% block title %}Book delete{% endblock %}

{% block content %}



    <h1>Удаление записи</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы действительно хотите удалить запись "{{ book.title }}"?</p>
            <form method="post">
                {% csrf_token %}
                <p>Для подтверждения введите почту в поле ниже:</p>
                <input type="text" name="подтверждение" placeholder="Введите название..." required>
                <br><br>
                <button type="submit">Удалить</button>
            </form>
            <a href="{% url 'book_list' %}">Отмена</a>
        </div>
    </div>
{% endblock %}
